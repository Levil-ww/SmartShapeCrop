[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
# [F17 修复] 移除对 DeprecationWarning 的全局屏蔽：
# 原先 ignore::DeprecationWarning 会掩盖 Pillow / numpy 即将移除 API 的信号，
# 增加升级（如 Python 3.13 兼容）风险。现已验证当前套件无该类告警，
# 直接放行让弃用告警在 pytest 摘要中可见；如未来出现第三方噪音，
# 请在对应调用点做针对性处理，而不是恢复全局屏蔽。
