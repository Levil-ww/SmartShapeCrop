[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
# [F17 修复] 移除对 DeprecationWarning 的全局屏蔽：
# 原先 ignore::DeprecationWarning 会掩盖 Pillow / numpy 即将移除 API 的信号，
# 增加升级（如 Python 3.13 兼容）风险。现已验证当前套件无该类告警，
# 直接放行让弃用告警在 pytest 摘要中可见；如未来出现第三方噪音，
# 请在对应调用点做针对性处理，而不是恢复全局屏蔽。
# [P0 防复发 2026-09-05] 把 PytestReturnNotNoneWarning 升为 ERROR：
# 17 个回归测试曾用 `return <bool>` 替代 assert，导致断言实际不校验。
# 若再有人写 return（非 None），整套测试会因收集/执行错误而全部失败，
# 起到强提醒作用。
filterwarnings =
    error::pytest.PytestReturnNotNoneWarning
# 注意：pytest.ini 不识别 collect_ignore / collect_ignore_glob（9.x 报 Unknown config option）。
# 收集忽略列表由 tests/conftest.py 维护（模块级变量），由 pytest hook 调用。
# 防御性 collect_ignore_glob 在项目根 conftest.py 中设置，覆盖 scripts/_archive 等
# 非 tests 目录下的 test_*.py 命名文件。
